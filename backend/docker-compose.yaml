services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: coding_interview_platform_api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    command: pnpm run start:dev

    networks:
      - app-network

networks:
  app-network:
    driver: bridge
